# A block-level device_id applies to every entity in the block; an entity may override it.
sensor:
  - platform: bresser
    model: bresser_7in1
    device_id: dev_a
    temperature:
      name: "Temperature"
    rssi:
      name: "Signal"
      device_id: dev_b
binary_sensor:
  - platform: bresser
    model: bresser_7in1
    device_id: dev_a
    battery_low:
      name: "Battery"
