# Replaces common.yaml for good_on_reading.yaml: the same scaffold with an on_reading
# automation on the hub.
esphome:
  name: config-test
  devices:
    - id: dev_a
      name: "Sub Device A"
    - id: dev_b
      name: "Sub Device B"

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

sx126x:
  id: radio
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  hw_version: sx1262
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  modulation: FSK
  frequency: 868.3MHz
  bitrate: 8210
  deviation: 57.1kHz
  bandwidth: 234_3kHz
  shaping: NONE
  sync_value: [0xAA, 0xAA, 0x2D, 0xD4]
  preamble_size: 2
  preamble_detect: 1
  payload_length: 32
  crc_enable: false
  whitening_enable: false
  rx_start: true

bresser:
  id: hub
  radio_id: radio
  on_reading:
    - lambda: 'ESP_LOGI("test", "%u %.1f", x.id, x.temperature.value_or(NAN));'
