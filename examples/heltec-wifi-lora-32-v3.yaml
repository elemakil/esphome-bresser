# Bresser 868 MHz receiver on a Heltec WiFi LoRa 32 (V3) -- ESP32-S3 + Semtech SX1262.
#
# A complete device config: copy it, create secrets.yaml from secrets.yaml.example, and
# flash. The station's readings appear in Home Assistant as entities of a "Bresser 7-in-1"
# sub-device.
#
# The radio settings below are known to work with a real Bresser 7-in-1 station: frames
# arrive every ~12 s and pass the decoder's LFSR-16 digest. If you have a different Bresser
# product (8-in-1, 3-in-1, air quality sensors), only the entity blocks at the bottom
# change -- the radio settings are the same for every product the decoder serves.

substitutions:
  name: bresser-receiver
  friendly_name: Bresser Receiver

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # The release this config is validated against. The sx126x schema has moved between
  # releases, so building on something older should fail loudly rather than subtly.
  min_version: 2026.10.0
  # Home Assistant sub-device, so the station's readings are filed under the station
  # rather than alongside the receiver's own diagnostics.
  devices:
    - id: dev_bresser
      name: "Bresser 7-in-1"

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source: github://elemakil/esphome-bresser@main
    components: [bresser]

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password

captive_portal:

# Wall-clock time for the `last_seen` entity. Without a time source the clock never becomes
# valid, and last_seen stays unpublished rather than reporting a 1970 timestamp.
time:
  - platform: homeassistant

# --- Radio ------------------------------------------------------------------
#
# CRC and whitening are OFF on purpose: the component does its own de-whitening and
# validates the frame's own LFSR-16 digest. Turning either on in the radio corrupts the payload.

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

sx126x:
  id: radio
  # Hard-wired on this board.
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14 # Heltec's own pin headers mislabel this as DIO0
  hw_version: sx1262

  rf_switch: true # DIO2 drives the RF switch
  tcxo_voltage: 1_8V # DIO3 supplies the TCXO. Omitting this = silent no-RX.
  tcxo_delay: 5ms

  modulation: FSK
  frequency: 868.3MHz
  bitrate: 8210 # baud; 124 us bit period
  deviation: 57.1kHz
  bandwidth: 234_3kHz # SX126x-specific enumerated value.
  shaping: NONE

  # Two bytes of the AA preamble plus Bresser's 2D D4 sync word. The packet engine consumes
  # these, so the payload it delivers starts right after 2D D4, which is what the component
  # expects.
  sync_value: [0xAA, 0xAA, 0x2D, 0xD4]
  preamble_size: 2
  # How many bytes of preamble pattern the detector requires BEFORE the sync word. 1 is a
  # known-good value: more can miss frames whose preamble arrives before the AGC settles,
  # and 0 lets noise trigger receptions that then abort.
  preamble_detect: 1
  payload_length: 32 # the decoder needs >= 25; real frames run ~33 with padding
  crc_enable: false
  whitening_enable: false

  rx_start: true

  # Optional: a hex dump of every packet, decoded or not. A line can be decoded offline with
  # the host build of the decoder (see tests/README.md), which separates "the radio locked"
  # from "the bytes are right" when tuning. Remove it once reception is settled.
  # The trigger yields (std::vector<uint8_t> x, float rssi, float snr).
  on_packet:
    then:
      - lambda: |-
          char hex[format_hex_size(64)];
          format_hex_to(hex, x);
          ESP_LOGD("radio", "rx %u bytes rssi=%.1f  %s", (unsigned) x.size(), rssi, hex);

# --- Decoding ---------------------------------------------------------------
#
# The component registers itself as a listener on the radio, so it receives packets
# alongside the on_packet trigger above rather than through it.
bresser:
  id: bresser_hub
  radio_id: radio
  # Runs for every valid frame, configured device or not. `x` is the decoded reading
  # (esphome::bresser::Reading); measurements are std::optional.
  # on_reading:
  #   - lambda: |-
  #       if (x.temperature.has_value())
  #         ESP_LOGI("main", "%u: %.1f °C", x.id, *x.temperature);

# --- Entities ---------------------------------------------------------------
#
# One block per entity platform for each physical sensor. `model` picks the field set. With
# one station in range no `sensor_id` is needed; if a neighbour's station shows up too, take
# your station's id from the log or the "Unknown Bresser devices" entity and add
# `sensor_id: <id>` to every block.
sensor:
  - platform: bresser
    model: bresser_7in1
    device_id: dev_bresser
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    wind_speed:
      name: "Wind Speed"
    wind_gust:
      name: "Wind Gust"
    wind_direction:
      name: "Wind Direction"
    rain:
      name: "Rain"
    illuminance:
      name: "Illuminance"
    uv_index:
      name: "UV Index"
    rssi:
      name: "Signal"

binary_sensor:
  - platform: bresser
    model: bresser_7in1
    device_id: dev_bresser
    battery_low:
      name: "Battery"
    startup:
      name: "Startup"
    online:
      name: "Online"

text_sensor:
  - platform: bresser
    model: bresser_7in1
    device_id: dev_bresser
    last_seen:
      name: "Last Seen"
  # Belongs to the receiver: lists Bresser sensors in range that no block above claims.
  - platform: bresser
    unknown_devices:
      name: "Unknown Bresser devices"
